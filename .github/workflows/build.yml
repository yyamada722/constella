name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# ビルドするだけなので読み取りのみ（リポジトリ既定の権限に依存させない）
permissions:
  contents: read

# 同じPRに続けてpushしたら古いrunはキャンセル
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-14
            label: macOS (arm64)
          - os: ubuntu-latest
            label: Linux (x64)

    steps:
      - uses: actions/checkout@v4
        with:
          # 後続のビルドはgit認証を使わない。.git/config にトークンを残さない
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # electron 本体 / electron-builder のダウンロードキャッシュ
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # PRでは --dir（未パッケージ）まで。インストーラ生成はリリース時のみ
      - name: Build (unpacked)
        run: npm run dist:dir
        env:
          # 未署名ビルド。macでキーチェーンを探しに行かせない
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # ad-hoc署名の封印が有効か検証。壊れているとApple Siliconで起動できない
      - name: Verify mac code signature
        if: runner.os == 'macOS'
        run: |
          app="$(ls -d release/mac*/Constella.app | head -1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app"

      # AppImage 化前の unpacked 出力が揃っているか（本体バイナリ + asar）を確認する。
      # 実行ファイル名は electron-builder の executableName 依存なので大文字小文字は問わない。
      - name: Verify Linux unpacked build
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          dir=release/linux-unpacked
          test -f "$dir/resources/app.asar"
          bin="$(find "$dir" -maxdepth 1 -type f -executable -iname constella | head -1)"
          if [ -z "$bin" ]; then
            echo "::error::$dir に本体バイナリ(constella)が見つかりません"
            ls -l "$dir"
            exit 1
          fi
          file -b "$bin" | grep -q ELF
          echo "ok: $bin"
