name: Release

on:
  push:
    # main にマージされたら package.json の version を見てリリース要否を判定する
    branches: [main]
    # タグを手で打った場合も従来どおり動く
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'リリースするタグ (例: v0.5.7)。空なら package.json の version を使う'
        required: false
        type: string

permissions:
  contents: read

# リリースは途中でキャンセルしない。main への連続pushは直列化する
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Decide whether to release
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi

          # 同名のリリースが既にあるなら何もしない（version据え置きのmainマージ／再実行対策）
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag は既にリリース済みのためスキップします"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag をリリースします"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.label }}
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact: windows
          - os: macos-14
            label: macOS (arm64)
            artifact: macos
          - os: ubuntu-latest
            label: Linux (x64)
            artifact: linux

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build installers
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # ad-hoc署名の封印が有効か検証。壊れているとApple Siliconで起動できない
      - name: Verify mac code signature
        if: runner.os == 'macOS'
        run: |
          app="$(ls -d release/mac*/Constella.app | head -1)"
          codesign --verify --deep --strict --verbose=2 "$app"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.dmg
            release/*.AppImage
            release/*.AppImage.blockmap
            release/latest*.yml

  release:
    name: Publish GitHub Release
    needs: [check, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::成果物が1つも見つかりません"
            exit 1
          fi
          printf 'publish %s with %d file(s)\n' "$RELEASE_TAG" "${#files[@]}"

          # 未署名ビルドのため、OSのセキュリティ警告の回避手順をノート冒頭に載せる
          # (--notes-file の内容の後ろに --generate-notes の自動生成分が続く)
          notes="$(mktemp)"
          cat > "$notes" <<'NOTES'
          ## ⚠️ インストール時の注意

          アプリは未署名のため、初回起動時に OS のセキュリティ警告が出ます。

          ### macOS

          初回起動時に「悪質なソフトウェアかどうかを確認できません」という警告が出ます。

          1. dmg を開き、Constella.app を `アプリケーション` フォルダへコピー
          2. 一度ダブルクリックして起動を試みる（警告ダイアログは閉じてOK）
          3. システム設定 → プライバシーとセキュリティ を開き、下の方に出る
             「"Constella" はブロックされました」の隣の **「このまま開く」** をクリック
          4. 以後は通常どおり起動できます

          ターミナルが使える場合は、代わりに次の1行でも起動できるようになります:

          ```
          xattr -cr /Applications/Constella.app
          ```

          ### Windows

          SmartScreen の警告が出た場合は「詳細情報」→「実行」で起動できます。

          ### Linux

          AppImage はインストール不要です。ダウンロード後に実行権限を付けて起動してください。

          ```
          chmod +x Constella-*.AppImage
          ./Constella-*.AppImage
          ```

          ---
          NOTES

          # タグが未作成ならこのコミットに対して作られる
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file "$notes" \
            --generate-notes \
            "${files[@]}"
