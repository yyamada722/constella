name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'draftリリースを作るタグ (例: v0.5.7)。空ならartifactの生成のみ'
        required: false
        type: string

jobs:
  package:
    name: Package ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # パッケージするだけ。リリース作成は release ジョブ側の権限で行う
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact: windows
          - os: macos-14
            label: macOS (arm64)
            artifact: macos

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build installers
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/latest*.yml

  release:
    name: Draft GitHub Release
    needs: package
    runs-on: ubuntu-latest
    # タグpush、または手動実行でタグを指定したときだけリリースを作る
    if: github.event_name == 'push' || github.event.inputs.tag != ''
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # 手動実行では github.ref_name がブランチ名になるので入力を優先
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mapfile -t files < <(find artifacts -type f | sort)
          printf 'release %s with %d file(s)\n' "$RELEASE_TAG" "${#files[@]}"
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --draft \
            --title "$RELEASE_TAG" \
            --generate-notes \
            "${files[@]}"
